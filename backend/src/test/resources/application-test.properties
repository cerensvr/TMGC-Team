spring.datasource.url=jdbc:h2:mem:skinshelf-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

app.jwt.secret=test-only-jwt-secret-that-is-long-enough-for-hmac
app.jwt.expiration-seconds=3600
app.cors.allowed-origins=http://localhost
app.gemini.api-key=
app.gemini.model=gemini-2.5-flash
