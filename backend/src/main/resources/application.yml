spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:2}
      minimum-idle: 0
      max-lifetime: 300000
      keepalive-time: 120000
      idle-timeout: 60000
      connection-timeout: 15000
  data:
    jpa:
      repositories:
        bootstrap-mode: ${JPA_REPOSITORY_BOOTSTRAP_MODE:lazy}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: ${PORT:8080}
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_THREADS_MAX:24}
      min-spare: ${SERVER_TOMCAT_THREADS_MIN_SPARE:2}
    max-connections: ${SERVER_TOMCAT_MAX_CONNECTIONS:100}
    accept-count: ${SERVER_TOMCAT_ACCEPT_COUNT:20}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:604800}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081,http://127.0.0.1:3000}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.6-flash}
    fallback-model: ${GEMINI_FALLBACK_MODEL:gemini-3.5-flash-lite}
