name: quality-check

on:
  # GitHub Actions is temporarily manual because the repository owner's
  # account is billing-locked. Restore push/pull_request triggers after GitHub
  # re-enables hosted runners for the account.
  workflow_dispatch:

jobs:
  frontend-build:
    name: Frontend TypeScript build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: npm run build

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Run Maven tests
        run: ./mvnw -B test
